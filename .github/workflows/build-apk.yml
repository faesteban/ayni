name: Build Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    name: Build & Release APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Set up Java 21
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Accept Android Licenses
        run: yes | sdkmanager --licenses 2>/dev/null || true

      - name: Install Frontend Dependencies
        working-directory: frontend
        run: npm install --no-audit

      - name: Build Frontend
        working-directory: frontend
        env:
          VITE_API_URL: https://api.ayni.estebanfa.es
        run: npm run build

      - name: Copy Web Assets to Android
        run: |
          mkdir -p frontend/android/app/src/main/assets/public
          cp -r frontend/dist/* frontend/android/app/src/main/assets/public/
          cp frontend/capacitor.config.json frontend/android/app/src/main/assets/capacitor.config.json
          echo "[]" > frontend/android/app/src/main/assets/capacitor.plugins.json

      - name: Make Gradlew Executable
        run: chmod +x frontend/android/gradlew

      - name: Build APK with Gradle
        working-directory: frontend/android
        run: |
          set +e
          ./gradlew assembleDebug --no-daemon > build.log 2>&1
          EXIT_CODE=$?
          if [ $EXIT_CODE -ne 0 ]; then
            grep -A 20 "What went wrong:" build.log | while IFS= read -r line; do
              echo "::error::$line"
            done
            cat build.log
            exit $EXIT_CODE
          fi

      - name: Prepare APK naming
        run: |
          APK_PATH=$(find frontend/android -name "*.apk" | head -n 1)
          echo "Found APK at: $APK_PATH"
          cp "$APK_PATH" Ayni.apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Ayni-APK
          path: Ayni.apk

      - name: Release APK
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
        with:
          tag_name: latest
          name: "Ayni para Android (Última versión)"
          body: "Descarga directa del APK de Ayni para móviles Android."
          files: Ayni.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
