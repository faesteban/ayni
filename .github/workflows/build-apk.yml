name: Build Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    name: Build & Release APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Install Frontend Dependencies
        working-directory: frontend
        run: npm install

      - name: Build Frontend
        working-directory: frontend
        env:
          VITE_API_URL: https://api.ayni.estebanfa.es
        run: npm run build

      - name: Sync Capacitor Android
        working-directory: frontend
        run: npx cap sync android

      - name: Make Gradlew Executable
        run: chmod +x frontend/android/gradlew

      - name: Build APK with Gradle
        working-directory: frontend/android
        run: ./gradlew assembleDebug --stacktrace

      - name: Prepare APK naming
        run: |
          cp frontend/android/app/build/outputs/apk/debug/app-debug.apk frontend/android/app/build/outputs/apk/debug/Ayni.apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Ayni-APK
          path: frontend/android/app/build/outputs/apk/debug/Ayni.apk

      - name: Release APK
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
        with:
          tag_name: latest
          name: "Ayni para Android (Última versión)"
          body: "Descarga directa del APK de Ayni para móviles Android."
          files: frontend/android/app/build/outputs/apk/debug/Ayni.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
