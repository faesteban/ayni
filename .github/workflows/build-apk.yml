name: Build Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    name: Build & Release APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Set up Java 21
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Accept Android Licenses
        run: yes | sdkmanager --licenses 2>/dev/null || true

      - name: Install Frontend Dependencies
        working-directory: frontend
        run: npm install --no-audit

      - name: Build Frontend
        working-directory: frontend
        env:
          VITE_API_URL: https://api.ayni.estebanfa.es
        run: npm run build

      - name: Copy Web Assets to Android
        run: |
          mkdir -p frontend/android/app/src/main/assets/public
          cp -r frontend/dist/* frontend/android/app/src/main/assets/public/
          cp frontend/capacitor.config.json frontend/android/app/src/main/assets/capacitor.config.json
          echo "[]" > frontend/android/app/src/main/assets/capacitor.plugins.json

      - name: Make Gradlew Executable
        run: chmod +x frontend/android/gradlew

      - name: Build APK with Gradle
        working-directory: frontend/android
        run: |
          ./gradlew assembleDebug --no-daemon --stacktrace > build.log 2>&1 || {
            echo "## Gradle Build Error" >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
            tail -n 120 build.log >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
            cat build.log
            exit 1
          }

      - name: Prepare APK naming
        run: |
          cp frontend/android/app/build/outputs/apk/debug/app-debug.apk frontend/android/app/build/outputs/apk/debug/Ayni.apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Ayni-APK
          path: frontend/android/app/build/outputs/apk/debug/Ayni.apk

      - name: Release APK
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
        with:
          tag_name: latest
          name: "Ayni para Android (Última versión)"
          body: "Descarga directa del APK de Ayni para móviles Android."
          files: frontend/android/app/build/outputs/apk/debug/Ayni.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
